<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 540" role="img" aria-labelledby="title desc">
<title id="title">Reported Graph-assisted RAG comparison on 200 HotpotQA questions</title>
<desc id="desc">Complete evidence: BM25 68%, Dense 67%, Graph-assisted 71%. Answer F1: BM25 47.233%, Dense 44.833%, Graph-assisted 46.933%. Graph versus Dense F1 difference 2.100 percentage points is not statistically conclusive because the reported paired 95% bootstrap interval includes zero. Values were transcribed from a technical report and were not independently recomputed.</desc>
<rect width="1180" height="540" rx="18" fill="#f8fafc"/>
<rect x="20" y="20" width="1140" height="500" rx="16" fill="#ffffff" stroke="#dbe4ef"/>
<text x="50" y="62" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0f172a">Graph-assisted RAG: results at a glance</text>
<text x="50" y="90" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">Reported on 200 development-derived HotpotQA questions · shared reranker and generator</text>
<line x1="590" y1="118" x2="590" y2="393" stroke="#e2e8f0" stroke-width="2"/>
<text x="50" y="137" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Complete annotated evidence</text>
<text x="640" y="137" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Answer F1</text>
<text x="50" y="183" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600">BM25</text>
  <rect x="200" y="160" width="288" height="24" rx="7" fill="#e9eef5"/>
  <rect x="200" y="160" width="195.84" height="24" rx="7" fill="#64748b"/>
  <text x="555" y="181" text-anchor="end" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">68.0%</text>
<text x="50" y="255" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600">Dense</text>
  <rect x="200" y="232" width="288" height="24" rx="7" fill="#e9eef5"/>
  <rect x="200" y="232" width="192.96" height="24" rx="7" fill="#3b82f6"/>
  <text x="555" y="253" text-anchor="end" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">67.0%</text>
<text x="50" y="327" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600">Graph-assisted</text>
  <rect x="200" y="304" width="288" height="24" rx="7" fill="#e9eef5"/>
  <rect x="200" y="304" width="204.48" height="24" rx="7" fill="#10b981"/>
  <text x="555" y="325" text-anchor="end" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">71.0%</text>
<text x="640" y="183" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600">BM25</text>
  <rect x="790" y="160" width="288" height="24" rx="7" fill="#e9eef5"/>
  <rect x="790" y="160" width="226.72" height="24" rx="7" fill="#64748b"/>
  <text x="1145" y="181" text-anchor="end" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">47.233%</text>
<text x="640" y="255" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600">Dense</text>
  <rect x="790" y="232" width="288" height="24" rx="7" fill="#e9eef5"/>
  <rect x="790" y="232" width="215.20" height="24" rx="7" fill="#3b82f6"/>
  <text x="1145" y="253" text-anchor="end" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">44.833%</text>
<text x="640" y="327" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600">Graph-assisted</text>
  <rect x="790" y="304" width="288" height="24" rx="7" fill="#e9eef5"/>
  <rect x="790" y="304" width="225.28" height="24" rx="7" fill="#10b981"/>
  <text x="1145" y="325" text-anchor="end" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">46.933%</text>
<text x="200" y="388" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="14">Bars scaled 0–100%</text>
<text x="790" y="388" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="14">Bars scaled 0–60%</text>
<line x1="50" y1="411" x2="1130" y2="411" stroke="#e2e8f0"/>
<text x="50" y="445" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Interpretation</text>
<text x="50" y="472" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#334155">Graph-assisted retrieval retained more annotated evidence than dense (71% vs 67%).</text>
<text x="50" y="496" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#334155">Answer F1 gain vs dense: +2.100 pp; reported paired 95% CI crosses zero — not conclusive.</text>
</svg>